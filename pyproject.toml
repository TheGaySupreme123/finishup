[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "finishup"
version = "0.3.0"
description = "A local-first evidence ledger and review engine for agent work"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shay Ben Shabtay" }]
keywords = ["agents", "evidence", "local-first", "mcp", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anyio==4.14.2",
    "apsw==3.53.3.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "mcp==1.28.1",
    "openai==2.46.0",
    "packaging==26.2",
    "platformdirs==4.10.0",
    "pydantic==2.13.4",
    "textual==8.2.8",
    "typer==0.27.0",
]

[project.optional-dependencies]
# Compatibility extra retained for existing install commands. Argon2 is also a
# base dependency because the first-run wizard can select a passphrase vault.
portable-recovery = ["argon2-cffi==25.1.0"]
semantic-openai = [
    # Compatibility extra retained for existing install commands. The standard
    # install now supports the first-run AI-powered review choice.
    "httpx==0.28.1",
    "openai==2.46.0",
]

[project.scripts]
finishup = "finishup.cli.entry:main"

[project.urls]
Homepage = "https://finishup.dev"
Documentation = "https://github.com/TheGaySupreme123/finishup/tree/main/docs"
Repository = "https://github.com/TheGaySupreme123/finishup"
Issues = "https://github.com/TheGaySupreme123/finishup/issues"
Changelog = "https://github.com/TheGaySupreme123/finishup/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis==6.156.6",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.15.22",
]

[tool.uv]
required-version = "==0.11.29"
prerelease = "disallow"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests", "tests/subprocess"]
testpaths = ["tests"]
markers = [
    "fault: destructive or abrupt-fault subprocess case; excluded from bounded PR runs",
    "kill_matrix: full deterministic durability kill matrix; serial release/nightly profile only",
    "live: opt-in live external integration; excluded from default CI",
    "live_keyring: live OS keyring probe; opt-in / release only",
    "live_provider: approved live provider profile probe; release environment only",
    "slow: wall-clock or resource-sensitive regression guard; may be deselected on contended runners",
    "soak: long-running scale/resource soak; nightly/release profile only",
]
