# .github/workflows/pr-ci.yml — bounded pull-request correctness gate.
#
# Authority: ADR-002, ADR-003, ADR-005, ADR-006, ADR-007; docs/INTERFACES.md.
#
# Fast, deterministic evidence that a public change preserves contracts, style/types, pure truth
# behavior, adapter parity, bounded durable/transport behavior, package construction, and the
# public/private boundary. Never uses production credentials or live providers. Required checks
# (branch protection) are aggregated by `pr-ci-required`.

name: PR CI

on:
  pull_request:
    # Include stacked PRs and base-branch changes, regardless of their target branch.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, "0.3"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  UV_VERSION: "0.11.29"
  UV_NO_PROGRESS: "1"
  UV_LOCKED: "1"
  PYTHONUTF8: "1"
  NODE_VERSION: "26.5.0"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  # trusted-console-boundary — adapter-only platform proof, not full Windows runtime support.
  # ---------------------------------------------------------------------------------------------
  trusted-console-boundary:
    name: trusted-console-boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv and pinned Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true

      - name: Test only the portable console boundary
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --python 3.14.6 --with pytest==9.1.1
          pytest tests/unit/cli/test_trusted_console.py -q

  # ---------------------------------------------------------------------------------------------
  # contracts-and-resources — spec manifest, generated schema/resource parity, public boundary.
  # ---------------------------------------------------------------------------------------------
  contracts-and-resources:
    name: contracts-and-resources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials, full history for boundary/append-only checks)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Reject symlink/path escape in owned resource and release roots
        run: |
          set -euo pipefail
          for root in schemas migrations fixtures skills release; do
            if [ -d "$root" ]; then
              found=$(find "$root" -type l -print)
              if [ -n "$found" ]; then
                echo "::error::symlink present under owned root $root:"
                echo "$found"
                exit 1
              fi
            fi
          done

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check dependency locks without modifying them
        run: uv sync --locked --all-extras --group dev

      - name: Verify generated schemas and packaged resources reached a fixed point
        run: uv run --locked python scripts/sync_resource_ripple.py --check

      - name: Verify the transitional yoetz distributions build and stay in lockstep (ADR-048)
        run: |
          set -euo pipefail
          uv run --locked python scripts/check_transitional_yoetz.py
          uv build --no-sources release/transitional-yoetz/python \
            --out-dir "${{ runner.temp }}/transitional-dist"
          uv run --locked python scripts/check_transitional_yoetz.py \
            --dist "${{ runner.temp }}/transitional-dist"

      - name: Verify CHECK continuation schemas are exact
        run: uv run --locked python scripts/sync_check_continuation_schemas.py --check

      - name: Verify repository-authority control schemas are exact
        run: uv run --locked python scripts/sync_repository_authority_schemas.py --check

      - name: Validate schema $id/$ref resolution from the local manifest (network denied)
        env:
          YZCI_DENY_NETWORK: "1"
        run: |
          uv run --locked pytest \
            tests/conformance/surfaces \
            tests/unit/version \
            -k "schema or manifest or resource" \
            -m "not fault and not soak and not live" -q --timeout=120

      - name: Verify released migration/vector files and versioned schemas are append-only
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ] || ! git cat-file -e "${BASE_REF}" 2>/dev/null; then
            echo "No comparable base commit (initial push); skipping append-only diff."
            exit 0
          fi
          for root in migrations fixtures/canonical; do
            if git cat-file -e "${BASE_REF}:${root}" 2>/dev/null; then
              removed=$(git diff --diff-filter=DMR --name-only "${BASE_REF}" -- "$root" || true)
              if [ -n "$removed" ]; then
                echo "::error::non-append-only change under $root against ${BASE_REF}:"
                echo "$removed"
                exit 1
              fi
            fi
          done
          release_tag=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "${release_tag}" ]; then
            echo "No release tag; versioned schemas are not yet frozen."
            exit 0
          fi
          changed_schemas=$(git diff --diff-filter=DMR --name-only \
            "refs/tags/${release_tag}" -- ':(glob)schemas/**/*.schema.json' || true)
          if [ -n "${changed_schemas}" ]; then
            echo "::error::released versioned schema changed against ${release_tag}:"
            echo "${changed_schemas}"
            exit 1
          fi

      - name: Run public-boundary scanner over the checkout
        run: uv run --locked python scripts/scan_public_boundary.py --source-tree .

      - name: Focused canonical/schema/protocol unit vectors (hash seed 0)
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv run --locked pytest tests/unit/protocol tests/unit/kernel \
            -m "not fault and not soak and not live" -q --timeout=120

      - name: Focused canonical/schema/protocol unit vectors (hash seed 1)
        env:
          PYTHONHASHSEED: "1"
        run: |
          uv run --locked pytest tests/unit/protocol tests/unit/kernel \
            -m "not fault and not soak and not live" -q --timeout=120

  # ---------------------------------------------------------------------------------------------
  # format-lint-type — exact locked format/lint/type commands.
  # ---------------------------------------------------------------------------------------------
  format-lint-type:
    name: format-lint-type
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Install Node (locked major/patch)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: ruff format --check .
        run: uv run --locked ruff format --check .

      - name: ruff check .
        run: uv run --locked ruff check .

      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts

      - name: npx --no-install pyright
        run: npx --no-install pyright

      - name: Validate GitHub Actions workflows with pinned actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -shellcheck= -pyflakes=

      - name: Validate build metadata and JSON hygiene
        run: |
          set -euo pipefail
          uv run --locked python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          uv run --locked python - <<'PY'
          import json
          import pathlib
          for path in pathlib.Path(".").rglob("*.json"):
              if any(part in {"node_modules", ".git", "__pycache__"} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Import-layer and domain/port boundary check
        run: |
          uv run --locked ruff check --select I --diff .
          # Filter may match zero tests when no boundary/layer cases are present; do not fail closed.
          uv run --locked pytest tests/unit/ports tests/unit/application \
            -k "boundary or layer or import" \
            -m "not fault and not soak and not live" -q --timeout=120 \
            || test $? -eq 5

  # ---------------------------------------------------------------------------------------------
  # unit-and-conformance — pure unit, bounded property examples, adapter conformance.
  # ---------------------------------------------------------------------------------------------
  unit-and-conformance:
    name: unit-and-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Isolate test home and private pytest temp directory
        run: bash scripts/ci/prepare_test_environment.sh

      - name: Unit, property, and conformance (bounded, excludes fault/soak/live)
        run: |
          uv run --locked pytest tests/unit tests/property tests/conformance \
            -m "not fault and not soak and not live" -q --timeout=120

  # ---------------------------------------------------------------------------------------------
  # older-python — the same bounded unit/conformance slice on every supported minor below the
  # release cell (issue #1119). The release cell stays CPython 3.14.6 in unit-and-conformance.
  # ---------------------------------------------------------------------------------------------
  older-python:
    name: older-python (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Isolate test home and private pytest temp directory
        run: bash scripts/ci/prepare_test_environment.sh

      - name: Unit, property, and conformance (bounded, excludes fault/soak/live)
        run: |
          uv run --locked pytest tests/unit tests/property tests/conformance \
            -m "not fault and not soak and not live" -q --timeout=120

  # ---------------------------------------------------------------------------------------------
  # installer-compatibility — install this candidate on supported Python minors with minimum
  # and current uv. These are compatibility smokes, separate from release reproducibility.
  # ---------------------------------------------------------------------------------------------
  installer-compatibility:
    name: installer-compatibility (Python ${{ matrix.python }}, uv ${{ matrix.uv }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14.6"]
        uv: ["0.11.29", "0.13.1"]
    permissions:
      contents: read
    env:
      UV_VERSION: ${{ matrix.uv }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install the selected uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ matrix.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify locked dependencies and interpreter selection
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv --version
          uv sync --locked --all-extras --group dev
          uv run --locked python - <<'PY'
          import os
          import sys
          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          assert sys.version_info[:len(expected)] == expected, sys.version
          print(sys.version)
          PY

      - name: Isolate test home and private pytest temp directory
        run: bash scripts/ci/prepare_test_environment.sh

      - name: Build and install the candidate wheel and sdist outside the checkout
        run: |
          set -euo pipefail
          uv build --no-sources --out-dir "${RUNNER_TEMP}/compat-dist"
          uv venv "${RUNNER_TEMP}/compat-venv"
          uv pip install --python "${RUNNER_TEMP}/compat-venv/bin/python" \
            "${RUNNER_TEMP}"/compat-dist/finishup-*.whl
          (cd "${RUNNER_TEMP}" && compat-venv/bin/finishup --help && compat-venv/bin/finishup version --json)
          uv pip install --python "${RUNNER_TEMP}/compat-venv/bin/python" --reinstall \
            "${RUNNER_TEMP}"/compat-dist/finishup-*.tar.gz
          (cd "${RUNNER_TEMP}" && compat-venv/bin/finishup --help && compat-venv/bin/finishup version --json)

  # ---------------------------------------------------------------------------------------------
  # integration — all current bounded integration families, split to keep job duration bounded.
  # ---------------------------------------------------------------------------------------------
  integration:
    name: integration (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        area: [storage, objects, application, closure, observation, providers, service, privacy]
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Isolate test home and private pytest temp directory
        run: bash scripts/ci/prepare_test_environment.sh

      - name: Assert exact locked APSW/SQLite identity before tests
        run: |
          uv run --locked python -c "
          import apsw
          print('apsw', apsw.apsw_version())
          print('sqlite', apsw.sqlite_lib_version())
          print('source id', apsw.sqlite3_sourceid())
          print('compile options', list(apsw.compile_options))
          "

      - name: Prepare enforcing Linux check sandbox
        if: matrix.area == 'observation'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Only this disposable runner is changed; product sandbox policy is unchanged.
          # Ubuntu's AppArmor restriction can outlive installing the distribution profile.
          if ! bwrap --die-with-parent --unshare-net --bind / / --dev /dev --proc /proc -- /bin/true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --die-with-parent --unshare-net --bind / / --dev /dev --proc /proc -- /bin/true

      - name: Bounded integration family (excludes fault/kill-matrix/soak/live)
        run: |
          env -u FINISHUP_ISOLATED_ROOT -u YOETZ_ISOLATED_ROOT \
            uv run --locked pytest "tests/integration/${{ matrix.area }}" \
            -m "not fault and not kill_matrix and not soak and not live" -q --timeout=180

  # ---------------------------------------------------------------------------------------------
  # cli-mcp-subprocess — bounded console/MCP subprocess parity and protocol purity.
  # ---------------------------------------------------------------------------------------------
  cli-mcp-subprocess:
    name: cli-mcp-subprocess
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the candidate wheel
        run: uv build --no-sources --wheel --out-dir "${{ runner.temp }}/dist"

      - name: Install the candidate wheel into an isolated environment
        run: |
          candidate_version=$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          uv venv "${{ runner.temp }}/subprocess-venv"
          uv pip install --python "${{ runner.temp }}/subprocess-venv/bin/python" \
            --no-index --no-deps --find-links "${{ runner.temp }}/dist" "finishup==${candidate_version}"
          uv pip install --python "${{ runner.temp }}/subprocess-venv/bin/python" \
            "finishup[semantic-openai,portable-recovery]==${candidate_version}"
          echo "${{ runner.temp }}/subprocess-venv/bin" >> "$GITHUB_PATH"

      - name: uv sync --locked (test runner tooling only)
        run: uv sync --locked --group dev

      - name: Isolate test home and private pytest temp directory
        run: |
          bash scripts/ci/prepare_test_environment.sh
          echo "FINISHUP_CANDIDATE_PYTHON=${{ runner.temp }}/subprocess-venv/bin/python" >> "$GITHUB_ENV"

      - name: Bounded console/module/MCP subprocess cases (excludes full kill matrix)
        run: |
          env -u FINISHUP_ISOLATED_ROOT -u YOETZ_ISOLATED_ROOT uv run --locked pytest tests/subprocess \
            --deselect tests/subprocess/test_kill_matrix.py \
            -m "not fault and not kill_matrix and not soak and not live" -q --timeout=180

      - name: Assert MCP stdout is protocol-only JSONL
        run: |
          env -u FINISHUP_ISOLATED_ROOT -u YOETZ_ISOLATED_ROOT uv run --locked pytest tests/subprocess/test_mcp_stdout_purity.py \
            -m "not fault and not soak and not live" -q --timeout=120

      - name: Installed-candidate MCP SDK and protocol compatibility (no live hosts/providers)
        run: |
          env -u FINISHUP_ISOLATED_ROOT -u YOETZ_ISOLATED_ROOT uv run --locked pytest \
            tests/capability/test_mcp_protocol_and_sdk.py \
            tests/capability/test_mcp_gate1_protocol_conformance.py \
            tests/capability/test_codex_six_tools.py \
            -m "not fault and not soak and not live" -q --timeout=120

      # condaforge/miniforge3:24.9.2-0 is Ubuntu 20.04 (glibc 2.31, inside the certified glibc
      # 2.28+ cell; Git 2.25, the documented minimum). There `finishup service run` exited 70 at
      # startup, and once that was fixed every connection closed as soon as the vault was ready
      # (#1040). Install the candidate with the documented uv command, then
      # scripts/ci/service_image_smoke.sh records the system Git version, initializes a vault
      # under an isolated root, and from inside a Git repository reads ready status, starts a task
      # and runs a deterministic check whose change capture must succeed.
      - name: Service runs in a conda image on glibc 2.31 and Git 2.25
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ runner.temp }}/dist:/dist:ro" \
            -v "$(command -v uv):/usr/local/bin/uv:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            condaforge/miniforge3:24.9.2-0@sha256:937dc1e8ab9ffc5f388f0d2a1ce5d24ba5b15850771571d7442fac1af53f3fad \
            bash -euo pipefail -c '
              if ! PATH=/bin:/usr/bin command -v git >/dev/null; then
                apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
              fi
              uv tool install --managed-python --python 3.14.6 /dist/finishup-*.whl >/dev/null
              export PATH="$HOME/.local/bin:$PATH"
              EXPECT_GIT_SERIES=2.25 CEREMONY_PYTHON=/opt/conda/bin/python3 \
                bash /scripts/ci/service_image_smoke.sh
            '

  # ---------------------------------------------------------------------------------------------
  # package-and-boundary — clean build, artifact inspection, install/verify, boundary scan.
  # ---------------------------------------------------------------------------------------------
  package-and-boundary:
    name: package-and-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Isolate test home and private pytest temp directory
        run: bash scripts/ci/prepare_test_environment.sh

      - name: uv build --no-sources (clean exported candidate)
        run: |
          rm -rf "${{ runner.temp }}/export"
          git worktree add --detach "${{ runner.temp }}/export" HEAD
          (cd "${{ runner.temp }}/export" && uv build --no-sources --out-dir "${{ runner.temp }}/dist")

      - name: Inspect sdist/wheel allowlists, metadata, entry points, and resource bytes
        run: |
          uv run --locked python scripts/verify_resource_manifest.py --check
          env -u FINISHUP_ISOLATED_ROOT -u YOETZ_ISOLATED_ROOT uv run --locked pytest tests/packaging \
            -m "not fault and not soak and not live" -q --timeout=180

      - name: Install the wheel outside the checkout
        run: |
          candidate_version=$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          uv venv "${{ runner.temp }}/pkg-venv"
          uv pip install --python "${{ runner.temp }}/pkg-venv/bin/python" \
            --no-index --no-deps --find-links "${{ runner.temp }}/dist" "finishup==${candidate_version}"
          uv pip install --python "${{ runner.temp }}/pkg-venv/bin/python" "finishup==${candidate_version}"

      - name: Run import, help, version --json, and strict-local vertical slice
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/pkg-venv/bin/python" -c "import finishup; print(finishup.__name__)"
          "${{ runner.temp }}/pkg-venv/bin/finishup" --help
          "${{ runner.temp }}/pkg-venv/bin/finishup" version --json

      - name: Run public-boundary scanner over checkout, sdist, wheel, metadata
        run: |
          uv run --locked python scripts/scan_public_boundary.py --source-tree . \
            --artifact "${{ runner.temp }}"/dist/*.whl \
            --artifact "${{ runner.temp }}"/dist/*.tar.gz

      - name: Negative control — synthetic canary must be blocked and never logged
        run: |
          set -euo pipefail
          canary_dir="${{ runner.temp }}/negative-control"
          mkdir -p "$canary_dir"
          canary="FINISHUP_CANARY_$(uv run --locked python -c 'import uuid; print(uuid.uuid4().hex)')"
          canary_file="${{ runner.temp }}/negative-control.canary"
          printf '%s' "$canary" > "$canary_file"
          echo "$canary" > "$canary_dir/leak.txt"
          if uv run --locked python scripts/scan_public_boundary.py \
              --evidence-dir "$canary_dir" --canary-file "$canary_file" > "${{ runner.temp }}/nc.log" 2>&1; then
            echo "::error::public-boundary scanner failed to block the negative-control canary"
            exit 1
          fi
          if grep -q "$canary" "${{ runner.temp }}/nc.log"; then
            echo "::error::canary text leaked into scanner output"
            exit 1
          fi
          rm -rf "$canary_dir" "$canary_file" "${{ runner.temp }}/nc.log"

  # ---------------------------------------------------------------------------------------------
  # pr-ci-required — stable branch-protection aggregation.
  # ---------------------------------------------------------------------------------------------
  pr-ci-required:
    name: pr-ci-required
    needs:
      - trusted-console-boundary
      - contracts-and-resources
      - format-lint-type
      - unit-and-conformance
      - older-python
      - installer-compatibility
      - integration
      - cli-mcp-subprocess
      - package-and-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    steps:
      - name: Verify every predecessor succeeded
        run: |
          set -euo pipefail
          declare -A results=(
            [trusted-console-boundary]="${{ needs.trusted-console-boundary.result }}"
            [contracts-and-resources]="${{ needs.contracts-and-resources.result }}"
            [format-lint-type]="${{ needs.format-lint-type.result }}"
            [unit-and-conformance]="${{ needs.unit-and-conformance.result }}"
            [older-python]="${{ needs.older-python.result }}"
            [installer-compatibility]="${{ needs.installer-compatibility.result }}"
            [integration]="${{ needs.integration.result }}"
            [cli-mcp-subprocess]="${{ needs.cli-mcp-subprocess.result }}"
            [package-and-boundary]="${{ needs.package-and-boundary.result }}"
          )
          failed=0
          echo "## PR CI job outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          for job in "${!results[@]}"; do
            outcome="${results[$job]}"
            echo "- ${job}: ${outcome}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ]; then
              echo "::error::required job ${job} was ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
