# .github/workflows/release.yml — approval-gated tagged public release pipeline.
#
# Authority: ADR-003, ADR-004, ADR-005, ADR-006, ADR-007; docs/INTERFACES.md; the release-gate
# suites under tests/packaging/ and tests/capability/.
#
# Build one immutable candidate from a clean version tag, prove it across advertised environments,
# assemble honest release evidence, and only then publish the exact tested bytes through dedicated
# environments. Construction, verification, approval, publication, and post-publication download
# verification are separated so no rebuild occurs between them. Artifact formats and publication
# environments are centralized under E-008; signing remains a v0.2 deferral — v0.1 requires
# checksums, SBOM, and truthful CI provenance only.

name: Tagged Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # optional approved prerelease suffix policy
  workflow_dispatch:
    inputs:
      tag:
        description: Intended exact release tag (e.g. v0.1.0). Need not exist for a dry run.
        required: true
        type: string
      candidate_ref:
        description: Current protected-branch ref for dry run, or immutable annotated tag for recovery.
        required: true
        type: string
        default: main
      dry_run:
        description: Rehearse current main without publication.
        required: true
        type: boolean
        default: true
      recovery:
        description: Re-run the full production path for an existing immutable annotated tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Normalized version/tag; a second run for the same tag must consume/verify the same digests.
  group: tagged-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recovery != 'true' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  # validate-release-source
  # ---------------------------------------------------------------------------------------------
  validate-release-source:
    name: validate-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      is-prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Reject an ambiguous manual release mode
        if: github.event_name == 'workflow_dispatch'
        run: |
          dry_run="${{ github.event.inputs.dry_run }}"
          recovery="${{ github.event.inputs.recovery }}"
          if [ "$dry_run" = "$recovery" ]; then
            echo "::error::workflow_dispatch requires exactly one of dry_run or recovery"
            exit 1
          fi

      - name: Checkout the exact release source (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Verify the ref is an annotated/signed tag reachable from the protected release branch
        if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          obj_type=$(git cat-file -t "refs/tags/${tag}" 2>/dev/null || echo missing)
          if [ "$obj_type" != "tag" ]; then
            echo "::error::${tag} is not an annotated tag object"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${tag}^{commit}" origin/main 2>/dev/null \
              && ! git branch -r --contains "refs/tags/${tag}^{commit}" | grep -q 'origin/main'; then
            echo "::error::tagged commit is not reachable from the protected release branch"
            exit 1
          fi

      - name: Verify the dry-run candidate is current protected main
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.recovery != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          candidate=$(git rev-parse HEAD)
          protected=$(git rev-parse origin/main)
          [ "$candidate" = "$protected" ] || {
            echo "::error::dry-run candidate ${candidate} is not current origin/main ${protected}"
            exit 1
          }

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Parse tag/version and verify exact equality with package metadata
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          commit=$(git rev-parse HEAD)
          pkg_version=$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::tag version ${version} does not equal pyproject.toml version ${pkg_version}"
            exit 1
          fi
          is_pre=false
          case "$version" in *-*) is_pre=true ;; esac
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_pre}" >> "$GITHUB_OUTPUT"

      - name: uv sync --locked (verify lockfiles are current)
        run: uv sync --locked --all-extras --group dev

      - name: Verify generated schema/resource parity
        run: |
          uv run --locked python scripts/sync_resource_ripple.py --check
          uv run --locked python scripts/sync_check_continuation_schemas.py --check

      - name: Verify migration/protocol/vector append-only policy against the previous release
        run: |
          set -euo pipefail
          prev_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -n1 || true)
          if [ -n "$prev_tag" ]; then
            removed=$(git diff --diff-filter=DMR --name-only "refs/tags/${prev_tag}" -- migrations schemas fixtures/canonical \
                ':(exclude)schemas/manifest.json' || true)
            if [ -n "$removed" ]; then
              echo "::error::non-append-only change against ${prev_tag}: $removed"
              exit 1
            fi
          fi
          if [ -n "$prev_tag" ]; then
            PREVIOUS_RELEASE="$prev_tag" uv run --locked python - <<'PYTHON'
          import json, os, pathlib, subprocess
          old = json.loads(subprocess.check_output([
              "git", "show", f"refs/tags/{os.environ['PREVIOUS_RELEASE']}:schemas/manifest.json"
          ]))
          new = json.loads(pathlib.Path("schemas/manifest.json").read_bytes())
          current = {member["path"]: member for member in new["members"]}
          for member in old["members"]:
              if current.get(member["path"]) != member:
                  raise SystemExit("released schema manifest entry changed: " + member["path"])
          PYTHON
          fi

      - name: Verify changelog/security/license/contributor metadata is complete
        run: |
          set -euo pipefail
          for f in CHANGELOG.md SECURITY.md LICENSE CODE_OF_CONDUCT.md CONTRIBUTING.md README.md; do
            [ -s "$f" ] || { echo "::error::missing/empty required repository file: $f"; exit 1; }
          done
          grep -q "${{ steps.version.outputs.value }}" CHANGELOG.md || \
            { echo "::error::CHANGELOG.md has no entry for ${{ steps.version.outputs.value }}"; exit 1; }

      - name: Verify curated release notes exist for this exact tag
        run: |
          set -euo pipefail
          notes="docs/releases/${{ steps.version.outputs.tag }}.md"
          [ -s "$notes" ] || {
            echo "::error::missing/empty curated release notes: ${notes} (see docs/releases/TEMPLATE.md)"
            exit 1
          }
          head -n 1 "$notes" | grep -q '^# ' || {
            echo "::error::${notes} must open with an H1 title line (used as the GitHub release title)"
            exit 1
          }

      - name: Reject private index/path/Git dependency, ignored/private file, transcript, secret, or canary
        run: |
          uv run --locked python scripts/scan_public_boundary.py --source-tree .

      - name: Create canonical source manifest/tar export tied to tag/commit
        run: |
          mkdir -p "${{ runner.temp }}/source-export"
          git archive --format=tar --prefix="finishup-${{ steps.version.outputs.value }}/" HEAD \
            | (cd "${{ runner.temp }}/source-export" && tar -xf -)
          (cd "${{ runner.temp }}/source-export" && tar -czf "${{ runner.temp }}/source-export.tar.gz" .)

  # ---------------------------------------------------------------------------------------------
  # build-candidate
  # ---------------------------------------------------------------------------------------------
  build-candidate:
    name: build-candidate
    needs: validate-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      candidate-digest: ${{ steps.digest.outputs.value }}
      artifact-name: candidate-${{ needs.validate-release-source.outputs.version }}
    steps:
      - name: Checkout the exact release source (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Build sdist/wheel twice from normalized clean exports (reproducibility scope)
        run: |
          set -euo pipefail
          for n in 1 2; do
            rm -rf "${{ runner.temp }}/export-$n"
            git worktree add --detach "${{ runner.temp }}/export-$n" HEAD
            ( cd "${{ runner.temp }}/export-$n" \
              && export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
              && uv build --no-sources --out-dir "${{ runner.temp }}/build-$n" )
          done

      - name: Select one candidate set; record/justify any permitted metadata difference
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/dist"
          diff_report="${{ runner.temp }}/reproducibility.txt"
          : > "$diff_report"
          for f in "${{ runner.temp }}"/build-1/*; do
            base=$(basename "$f")
            if ! cmp -s "$f" "${{ runner.temp }}/build-2/$base"; then
              echo "byte-identical: no ($base)" >> "$diff_report"
            else
              echo "byte-identical: yes ($base)" >> "$diff_report"
            fi
          done
          cp "${{ runner.temp }}"/build-1/* "${{ runner.temp }}/dist/"
          cp "$diff_report" "${{ runner.temp }}/dist/REPRODUCIBILITY.txt"

      - name: Inspect allowlisted members and metadata before upload
        run: uv run --locked python scripts/verify_resource_manifest.py --check

      - name: Generate candidate manifest (tag/commit, lock/build tool, digests, resource set, runner identity)
        id: digest
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/dist" && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          (cd "${{ runner.temp }}/dist" && sha256sum --check SHA256SUMS)
          digest=$(sha256sum "${{ runner.temp }}/dist/SHA256SUMS" | cut -d' ' -f1)
          uv run --locked python -c "
          import json, platform
          json.dump({
              'tag': '${{ needs.validate-release-source.outputs.tag }}',
              'version': '${{ needs.validate-release-source.outputs.version }}',
              'commit': '${{ needs.validate-release-source.outputs.commit }}',
              'digest': '${digest}',
              'runner': platform.platform(),
              'uv': '0.11.29',
              'python': '3.14.6',
          }, open('${{ runner.temp }}/dist/candidate.json', 'w'), indent=2)
          "
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the immutable candidate artifacts
        if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "${{ runner.temp }}/dist/*.whl,${{ runner.temp }}/dist/*.tar.gz"

      - name: Upload immutable short-retention internal candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/dist
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # build-npm-launcher — one immutable dependency-free delegator, version-locked to PyPI.
  # ---------------------------------------------------------------------------------------------
  build-npm-launcher:
    name: build-npm-launcher
    needs: validate-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      npm-digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Checkout the exact release source (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Install Node and npm (locked versions, no release cache)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install the locked npm CLI
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Verify the public launcher contract and exact version lock
        run: |
          set -euo pipefail
          [ "$(npm --version)" = "12.0.1" ] || {
            echo "::error::expected npm 12.0.1, got $(npm --version)"
            exit 1
          }
          node - <<'NODE'
          const fs = require("node:fs");
          const launcher = JSON.parse(fs.readFileSync("support/npm-launcher/package.json", "utf8"));
          const pyproject = fs.readFileSync("pyproject.toml", "utf8");
          const match = pyproject.match(/^version = "([^"]+)"$/m);
          if (!match || launcher.version !== match[1]) throw new Error("npm/PyPI version drift");
          if (launcher.private !== false) throw new Error("npm launcher is not public");
          if (launcher.name !== "finishup") throw new Error("unexpected npm package name");
          if (launcher.repository?.url !== "git+https://github.com/TheGaySupreme123/finishup.git") {
            throw new Error("npm provenance repository does not match the release repository");
          }
          for (const field of ["dependencies", "devDependencies", "optionalDependencies", "scripts"]) {
            if (field in launcher) throw new Error(`delegation-only package contains ${field}`);
          }
          NODE

      - name: Pack the npm launcher once and inspect its complete member set
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/npm-dist" "${{ runner.temp }}/npm-inspect"
          npm pack ./support/npm-launcher \
            --pack-destination "${{ runner.temp }}/npm-dist" --json \
            > "${{ runner.temp }}/npm-pack.json"
          tar -xzf "${{ runner.temp }}/npm-dist/finishup-${{ needs.validate-release-source.outputs.version }}.tgz" \
            -C "${{ runner.temp }}/npm-inspect"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "npm-inspect" / "package"
          members = sorted(
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          )
          expected = ["README.md", "bin/finishup.js", "package.json"]
          if members != expected:
              raise SystemExit(f"unexpected npm tarball members: {members}")
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          if package["name"] != "finishup" or package["version"] != "${{ needs.validate-release-source.outputs.version }}":
              raise SystemExit("packed npm identity mismatch")
          PY

      - name: Record npm candidate digest and manifest
        id: digest
        run: |
          set -euo pipefail
          tgz="${{ runner.temp }}/npm-dist/finishup-${{ needs.validate-release-source.outputs.version }}.tgz"
          digest=$(sha256sum "$tgz" | cut -d' ' -f1)
          (cd "${{ runner.temp }}/npm-dist" && sha256sum "$(basename "$tgz")" > NPM_SHA256SUMS)
          python3 - <<PY
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "npm-dist" / "npm-candidate.json"
          out.write_text(json.dumps({
              "tag": "${{ needs.validate-release-source.outputs.tag }}",
              "version": "${{ needs.validate-release-source.outputs.version }}",
              "commit": "${{ needs.validate-release-source.outputs.commit }}",
              "digest": "sha256:${digest}",
              "node": "26.5.0",
              "npm": "12.0.1",
          }, indent=2) + "\n", encoding="utf-8")
          PY
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable npm candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/npm-dist
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # build-transitional — the deprecated `yoetz` names (ADR-048): a PyPI distribution that depends
  # on the exact same-version finishup and declares only the `yoetz` alias, and an npm launcher
  # that delegates to it. Built once, smoke-tested against the exact finishup candidate, and
  # published only after finishup itself is live.
  # ---------------------------------------------------------------------------------------------
  build-transitional:
    name: build-transitional
    needs: [validate-release-source, build-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      transitional-digest: ${{ steps.digest.outputs.value }}
      transitional-npm-digest: ${{ steps.npm-digest.outputs.value }}
    steps:
      - name: Checkout the exact release source (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Verify the transitional sources are in lockstep with this release
        run: uv run --locked python scripts/check_transitional_yoetz.py

      - name: Build the transitional sdist/wheel twice from normalized clean exports
        run: |
          set -euo pipefail
          for n in 1 2; do
            rm -rf "${{ runner.temp }}/transitional-export-$n"
            git worktree add --detach "${{ runner.temp }}/transitional-export-$n" HEAD
            ( cd "${{ runner.temp }}/transitional-export-$n" \
              && export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
              && uv build --no-sources release/transitional-yoetz/python \
                --out-dir "${{ runner.temp }}/transitional-build-$n" )
          done
          mkdir -p "${{ runner.temp }}/transitional-dist"
          : > "${{ runner.temp }}/transitional-dist/TRANSITIONAL_REPRODUCIBILITY.txt"
          for f in "${{ runner.temp }}"/transitional-build-1/*; do
            base=$(basename "$f")
            if cmp -s "$f" "${{ runner.temp }}/transitional-build-2/$base"; then
              echo "byte-identical: yes ($base)" >> "${{ runner.temp }}/transitional-dist/TRANSITIONAL_REPRODUCIBILITY.txt"
            else
              echo "byte-identical: no ($base)" >> "${{ runner.temp }}/transitional-dist/TRANSITIONAL_REPRODUCIBILITY.txt"
            fi
          done
          cp "${{ runner.temp }}"/transitional-build-1/* "${{ runner.temp }}/transitional-dist/"

      - name: Inspect the transitional wheel/sdist members, single alias script and exact pin
        run: |
          uv run --locked python scripts/check_transitional_yoetz.py \
            --dist "${{ runner.temp }}/transitional-dist"

      - name: Download the exact finishup candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/candidate

      - name: Smoke the alias, python -m yoetz and the legacy runtime bootstrap against the candidate
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          (cd "${{ runner.temp }}/candidate" && sha256sum --check SHA256SUMS)
          venv="${{ runner.temp }}/transitional-venv"
          uv venv --python 3.14.6 "$venv"
          # Runtime dependencies resolve from the index; both FinishUP-owned wheels come only
          # from the exact local candidate and transitional build.
          uv pip install --python "$venv/bin/python" "${{ runner.temp }}/candidate/finishup-${version}-py3-none-any.whl"
          uv pip install --python "$venv/bin/python" --no-index --no-deps \
            --find-links "${{ runner.temp }}/transitional-dist" "yoetz==${version}"
          [ "$("$venv/bin/yoetz" --version)" = "$version" ] || {
            echo "::error::the yoetz alias did not print the bare release version"
            exit 1
          }
          [ "$("$venv/bin/python" -m yoetz --version)" = "$version" ] || {
            echo "::error::python -m yoetz did not print the bare release version"
            exit 1
          }
          "$venv/bin/python" -I -c "from yoetz.adapters.release_runtime import adopt_release_lease; from yoetz.cli.entry import main"
          [ -x "$venv/bin/finishup" ] || { echo "::error::finishup script missing beside the alias"; exit 1; }

      - name: Record the transitional Python digest
        id: digest
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/transitional-dist" \
            && sha256sum ./*.whl ./*.tar.gz > TRANSITIONAL_SHA256SUMS \
            && sha256sum --check TRANSITIONAL_SHA256SUMS)
          digest=$(sha256sum "${{ runner.temp }}/transitional-dist/TRANSITIONAL_SHA256SUMS" | cut -d' ' -f1)
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the transitional artifacts
        if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "${{ runner.temp }}/transitional-dist/*.whl,${{ runner.temp }}/transitional-dist/*.tar.gz"

      - name: Install Node and npm (locked versions, no release cache)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install the locked npm CLI
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Pack the transitional npm launcher once and inspect its complete member set
        id: npm-digest
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          mkdir -p "${{ runner.temp }}/transitional-npm-dist" "${{ runner.temp }}/transitional-npm-inspect"
          npm pack ./release/transitional-yoetz/npm \
            --pack-destination "${{ runner.temp }}/transitional-npm-dist" --json \
            > "${{ runner.temp }}/transitional-npm-pack.json"
          tgz="${{ runner.temp }}/transitional-npm-dist/yoetz-${version}.tgz"
          tar -xzf "$tgz" -C "${{ runner.temp }}/transitional-npm-inspect"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "transitional-npm-inspect" / "package"
          members = sorted(
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          )
          expected = ["README.md", "bin/yoetz.js", "package.json"]
          if members != expected:
              raise SystemExit(f"unexpected transitional npm tarball members: {members}")
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          if package["name"] != "yoetz" or package["version"] != "${{ needs.validate-release-source.outputs.version }}":
              raise SystemExit("packed transitional npm identity mismatch")
          PY
          (cd "${{ runner.temp }}/transitional-npm-dist" && sha256sum "$(basename "$tgz")" > TRANSITIONAL_NPM_SHA256SUMS)
          echo "value=$(sha256sum "$tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable transitional Python candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transitional-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/transitional-dist
          retention-days: 7

      - name: Upload the immutable transitional npm candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transitional-npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/transitional-npm-dist
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # verify-linux-x86_64
  # ---------------------------------------------------------------------------------------------
  verify-linux-x86_64:
    name: verify-linux-x86_64
    needs: [validate-release-source, build-candidate]
    runs-on: ubuntu-24.04 # glibc/manylinux 2.28 x86-64 certified target
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download the built candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/dist

      - name: Verify candidate digest before use
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/dist" && sha256sum --check SHA256SUMS)
          digest=$(sha256sum "${{ runner.temp }}/dist/SHA256SUMS" | cut -d' ' -f1)
          [ "$digest" = "${{ needs.build-candidate.outputs.candidate-digest }}" ] || \
            { echo "::error::downloaded candidate digest mismatch"; exit 1; }

      - name: Install candidate outside checkout; assert OS/CPU/ABI/filesystem/Python/APSW/SQLite identity
        run: |
          uv venv "${{ runner.temp }}/verify-venv"
          uv pip install --python "${{ runner.temp }}/verify-venv/bin/python" \
            --no-deps --find-links "${{ runner.temp }}/dist" "finishup==${{ needs.validate-release-source.outputs.version }}"
          uv pip install --python "${{ runner.temp }}/verify-venv/bin/python" \
            "finishup[semantic-openai,portable-recovery]==${{ needs.validate-release-source.outputs.version }}"
          "${{ runner.temp }}/verify-venv/bin/python" -c "
          import apsw, platform, sys
          assert sys.version_info[:2] == (3, 14)
          print('platform', platform.platform())
          print('apsw', apsw.apsw_version(), 'sqlite', apsw.sqlite_lib_version())
          print('sqlite source id', apsw.sqlite3_sourceid())
          "

      - name: version/startup, resource/schema/migration identity, strict-local six operations, MCP/CLI subprocess
        run: |
          "${{ runner.temp }}/verify-venv/bin/finishup" version --json
          uv sync --locked --group dev
          # Production vault tests must not use pytest's shared /tmp base or a repository path.
          # Resolve runner temp first so macOS aliases cannot enter the private state path.
          release_test_root="$(.venv/bin/python -c 'import os; from pathlib import Path; print((Path(os.environ["RUNNER_TEMP"]) / "finishup-integration").resolve())')"
          uv run --locked pytest tests/packaging \
            --deselect tests/packaging/test_offline_reinstall.py::test_corrupted_wheel_fails_exact_hash_verification_before_any_install \
            --deselect tests/packaging/test_offline_reinstall.py::test_correct_hash_matching_the_real_wheel_installs_cleanly \
            -m "not fault and not soak and not live" -q --timeout=900
          real_uv="$(command -v uv)"
          tagged_uv_wrapper="${{ runner.temp }}/tagged-uv-bin"
          mkdir -p "$tagged_uv_wrapper"
          cat > "$tagged_uv_wrapper/uv" <<'UV_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "pip" && "${2:-}" == "install" ]]; then
            shift 2
            has_no_index=false
            for argument in "$@"; do
              if [[ "$argument" == "--no-index" ]]; then
                has_no_index=true
                break
              fi
            done
            if [[ "$has_no_index" == false ]]; then
              set -- --no-index "$@"
            fi
            exec "${FINISHUP_REAL_UV:?}" pip install "$@"
          fi
          exec "${FINISHUP_REAL_UV:?}" "$@"
          UV_WRAPPER
          chmod +x "$tagged_uv_wrapper/uv"
          FINISHUP_REAL_UV="$real_uv" \
          PATH="$tagged_uv_wrapper:$PATH" \
          UV_CACHE_DIR="${{ runner.temp }}/tagged-offline-cache" \
            .venv/bin/pytest \
            tests/packaging/test_offline_reinstall.py::test_corrupted_wheel_fails_exact_hash_verification_before_any_install \
            tests/packaging/test_offline_reinstall.py::test_correct_hash_matching_the_real_wheel_installs_cleanly \
            -q --timeout=900
          YZCI_DENY_NETWORK=1 \
          FINISHUP_CANDIDATE_PYTHON="${{ runner.temp }}/verify-venv/bin/python" \
            uv run --locked pytest tests/subprocess \
            -m "not fault and not soak and not live" -q --timeout=900
          # Linux approved-command execution remains a documented fail-closed alpha limitation.
          YZCI_DENY_NETWORK=1 \
          FINISHUP_CANDIDATE_PYTHON="${{ runner.temp }}/verify-venv/bin/python" \
            uv run --locked pytest tests/integration \
            --basetemp "$release_test_root" \
            --deselect tests/integration/observation/test_acceptance_scenarios.py::test_approved_check_stale_when_digest_changes \
            --deselect tests/integration/observation/test_production_composition.py::test_approved_true_check_succeeds_in_sandbox \
            -m "not fault and not soak and not live" -q --timeout=900

      - name: Clean install/upgrade/rollback/uninstall/data-retention/offline reinstall, backup/restore, key backend states
        run: |
          "${{ runner.temp }}/verify-venv/bin/uv" --version >/dev/null 2>&1 || true
          uv pip uninstall --python "${{ runner.temp }}/verify-venv/bin/python" -y finishup
          uv pip install --python "${{ runner.temp }}/verify-venv/bin/python" --no-index \
            --find-links "${{ runner.temp }}/dist" "finishup==${{ needs.validate-release-source.outputs.version }}"
          "${{ runner.temp }}/verify-venv/bin/finishup" version --json

      - name: Installed-artifact boundary scan
        run: |
          installed_root=$("${{ runner.temp }}/verify-venv/bin/python" -c \
            'import pathlib, finishup; print(pathlib.Path(finishup.__file__).parent)')
          uv run --locked python scripts/scan_public_boundary.py --runtime-tree "$installed_root"

