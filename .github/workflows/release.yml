  # ---------------------------------------------------------------------------------------------
  # fault-release-profile — invokes nightly-fault.yml release profile at the exact candidate digest.
  # ---------------------------------------------------------------------------------------------
  fault-release-profile:
    name: fault-release-profile
    needs: [validate-release-source, build-candidate]
    uses: ./.github/workflows/nightly-fault.yml
    permissions:
      contents: read
      actions: read
    with:
      profile: release
      candidate-digest: ${{ needs.build-candidate.outputs.candidate-digest }}
      candidate-artifact-name: ${{ needs.build-candidate.outputs.artifact-name }}

  # ---------------------------------------------------------------------------------------------
  # capability-release-profile — invokes capability.yml release profile at the exact candidate digest.
  # ---------------------------------------------------------------------------------------------
  capability-release-profile:
    name: capability-release-profile
    needs: [validate-release-source, build-candidate]
    uses: ./.github/workflows/capability.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate-digest: ${{ needs.build-candidate.outputs.candidate-digest }}
      candidate-artifact-name: ${{ needs.build-candidate.outputs.artifact-name }}
      tested_set_profile: v0.3-mcp-1.30.0
      # Only run the approved live-provider cell when release policy has explicitly claimed and
      # approved it (reviewed repository variable, never inferred from the tag alone).
      live_provider: ${{ vars.RELEASE_LIVE_PROVIDER_CLAIM == 'true' }}
    secrets: inherit

  # ---------------------------------------------------------------------------------------------
  # security-privacy-release — invokes security-privacy.yml release profile at the candidate digest.
  # ---------------------------------------------------------------------------------------------
  security-privacy-release:
    name: security-privacy-release
    needs: [validate-release-source, build-candidate]
    uses: ./.github/workflows/security-privacy.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate-digest: ${{ needs.build-candidate.outputs.candidate-digest }}
      candidate-artifact-name: ${{ needs.build-candidate.outputs.artifact-name }}

  # ---------------------------------------------------------------------------------------------
  # assemble-release-evidence
  # ---------------------------------------------------------------------------------------------
  assemble-release-evidence:
    name: assemble-release-evidence
    needs:
      - validate-release-source
      - build-candidate
      - verify-linux-x86_64
      - verify-macos-arm64
      - fault-release-profile
      - capability-release-profile
      - security-privacy-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      evidence-digest: ${{ steps.evidence.outputs.digest }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_ref || github.ref }}

      - name: Install uv (locked version)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync --locked
        run: uv sync --locked --all-extras --group dev

      - name: Download the exact Python candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/inputs/candidate-${{ needs.validate-release-source.outputs.version }}

      - name: Download the exact capability matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capability-matrix
          path: ${{ runner.temp }}/inputs/capability-matrix

      - name: Download the generated and public-boundary-scanned CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-dependency-evidence
          path: ${{ runner.temp }}/inputs/security-dependency-evidence

      - name: Build the release-inputs manifest for the evidence generator
        run: |
          uv run --locked python scripts/build_release_inputs.py \
            --candidate-version "${{ needs.validate-release-source.outputs.version }}" \
            --candidate-tag "${{ needs.validate-release-source.outputs.tag }}" \
            --candidate-commit "${{ needs.validate-release-source.outputs.commit }}" \
            --artifact-root "${{ runner.temp }}/inputs/candidate-${{ needs.validate-release-source.outputs.version }}" \
            --candidate-digest "sha256:${{ needs.build-candidate.outputs.candidate-digest }}" \
            --support-matrix "${{ runner.temp }}/inputs/capability-matrix/capability-matrix.json" \
            --known-limitations release/known-limitations.json \
            --gate-record '{"name":"clean_source_identity","source_results":["${{ needs.validate-release-source.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}"]}' \
            --gate-record '{"name":"artifact_checksums","source_results":["${{ needs.build-candidate.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}"]}' \
            --gate-record '{"name":"resource_manifest_parity","source_results":["${{ needs.validate-release-source.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}"]}' \
            --gate-record '{"name":"unit_tests","source_results":["${{ needs.security-privacy-release.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.security-privacy-release.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"property_tests","source_results":["${{ needs.fault-release-profile.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.fault-release-profile.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"integration_tests","source_results":["${{ needs.verify-linux-x86_64.result }}","${{ needs.verify-macos-arm64.result }}","${{ needs.fault-release-profile.result }}","${{ needs.capability-release-profile.result }}","${{ needs.security-privacy-release.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.fault-release-profile.outputs.manifest-digest }}","sha256:${{ needs.capability-release-profile.outputs.manifest-digest }}","sha256:${{ needs.security-privacy-release.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"conformance_tests","source_results":["${{ needs.verify-linux-x86_64.result }}","${{ needs.verify-macos-arm64.result }}","${{ needs.capability-release-profile.result }}","${{ needs.security-privacy-release.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.capability-release-profile.outputs.manifest-digest }}","sha256:${{ needs.security-privacy-release.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"packaging_tests","source_results":["${{ needs.verify-linux-x86_64.result }}","${{ needs.verify-macos-arm64.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}"]}' \
            --gate-record '{"name":"security_privacy_scan","source_results":["${{ needs.security-privacy-release.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.security-privacy-release.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"capability_matrix","source_results":["${{ needs.capability-release-profile.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.capability-release-profile.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"dependency_vulnerability_license","source_results":["${{ needs.security-privacy-release.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}","sha256:${{ needs.security-privacy-release.outputs.manifest-digest }}"]}' \
            --gate-record '{"name":"clean_install","source_results":["${{ needs.verify-linux-x86_64.result }}","${{ needs.verify-macos-arm64.result }}"],"input_digests":["sha256:${{ needs.build-candidate.outputs.candidate-digest }}"]}' \
            --output "${{ runner.temp }}/release-inputs.json"

      - name: generate_release_evidence.py --write
        run: |
          uv run --locked python scripts/generate_release_evidence.py \
            --input-manifest "${{ runner.temp }}/release-inputs.json" \
            --output-dir "${{ runner.temp }}/release-evidence/${{ needs.validate-release-source.outputs.version }}" --write

      - name: generate_release_evidence.py --check
        run: |
          uv run --locked python scripts/generate_release_evidence.py \
            --input-manifest "${{ runner.temp }}/release-inputs.json" \
            --output-dir "${{ runner.temp }}/release-evidence/${{ needs.validate-release-source.outputs.version }}" --check

      - name: Add the exact scanned CycloneDX SBOM to the public release evidence
        run: |
          set -euo pipefail
          source="${{ runner.temp }}/inputs/security-dependency-evidence/sbom.cdx.json"
          destination="${{ runner.temp }}/release-evidence/${{ needs.validate-release-source.outputs.version }}/finishup-${{ needs.validate-release-source.outputs.version }}.sbom.cdx.json"
          [ -f "$source" ] || { echo "::error::security workflow SBOM artifact is missing"; exit 1; }
          cp -- "$source" "$destination"

      - name: Public-boundary scan the assembled evidence
        run: |
          uv run --locked python scripts/scan_public_boundary.py \
            --evidence-dir "${{ runner.temp }}/release-evidence"

      - name: Digest the release evidence bundle
        id: evidence
        run: |
          digest=$(find "${{ runner.temp }}/release-evidence" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release evidence — ${{ needs.validate-release-source.outputs.tag }}"
            echo "candidate digest: ${{ needs.build-candidate.outputs.candidate-digest }}"
            echo "evidence digest: ${digest}"
            echo "dry_run: ${{ env.DRY_RUN }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/release-evidence
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # approve-publication — digest-bound environment checkpoint; never runs for dry runs.
  # ---------------------------------------------------------------------------------------------
  approve-publication:
    name: approve-publication
    needs:
      - validate-release-source
      - build-candidate
      - build-npm-launcher
      - build-transitional
      - assemble-release-evidence
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Record the exact bytes this approval authorizes
        run: |
          {
            echo "tag: ${{ needs.validate-release-source.outputs.tag }}"
            echo "Python candidate digest: ${{ needs.build-candidate.outputs.candidate-digest }}"
            echo "npm candidate digest: ${{ needs.build-npm-launcher.outputs.npm-digest }}"
            echo "transitional yoetz Python digest: ${{ needs.build-transitional.outputs.transitional-digest }}"
            echo "transitional yoetz npm digest: ${{ needs.build-transitional.outputs.transitional-npm-digest }}"
            echo "evidence digest: ${{ needs.assemble-release-evidence.outputs.evidence-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # publish-pypi
  # ---------------------------------------------------------------------------------------------
  publish-pypi:
    name: publish-pypi
    needs: [validate-release-source, build-candidate, approve-publication]
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing only; no long-lived package token
      contents: read
    steps:
      - name: Download the built candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/dist

      - name: Verify candidate digest before publication
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/dist" && sha256sum --check SHA256SUMS)
          digest=$(sha256sum "${{ runner.temp }}/dist/SHA256SUMS" | cut -d' ' -f1)
          [ "$digest" = "${{ needs.build-candidate.outputs.candidate-digest }}" ] || \
            { echo "::error::candidate digest mismatch before publish"; exit 1; }

      - name: Stage only Python distribution files for the publisher
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=("${{ runner.temp }}/dist/"*.whl "${{ runner.temp }}/dist/"*.tar.gz)
          [ "${#artifacts[@]}" -eq 2 ] || {
            echo "::error::expected exactly one wheel and one sdist"
            exit 1
          }
          mkdir -p "${{ runner.temp }}/pypi-dist"
          cp -- "${artifacts[@]}" "${{ runner.temp }}/pypi-dist/"

      - name: Verify PyPI is absent or exactly reconciled for recovery
        id: pypi-state
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/finishup/${version}/json")
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              [ "${{ github.event.inputs.recovery }}" = "true" ] || {
                echo "::error::finishup==${version} already exists on PyPI"
                exit 1
              }
              curl --fail --silent --show-error --location \
                "https://pypi.org/pypi/finishup/${version}/json" \
                --output "${{ runner.temp }}/pypi-existing.json"
              PYPI_METADATA="${{ runner.temp }}/pypi-existing.json" \
              PYPI_DIST="${{ runner.temp }}/pypi-dist" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["PYPI_METADATA"]).read_text(encoding="utf-8"))
          remote = {entry["filename"]: entry["digests"]["sha256"] for entry in metadata["urls"]}
          local_files = sorted(Path(os.environ["PYPI_DIST"]).iterdir())
          local = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in local_files}
          if local != remote:
              raise SystemExit(f"published PyPI bytes differ from recovery candidate: {local} != {remote}")
          PY
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI preflight returned HTTP ${status}"
              exit 1
              ;;
          esac

      - name: Publish the prebuilt sdist/wheel via PyPI Trusted Publishing (skip-existing disabled)
        if: steps.pypi-state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: ${{ runner.temp }}/pypi-dist
          skip-existing: false
          verify-metadata: true
          print-hash: true

  # ---------------------------------------------------------------------------------------------
  # publish-npm — after PyPI because the launcher delegates to that exact Python version.
  # ---------------------------------------------------------------------------------------------
  publish-npm:
    name: publish-npm
    needs: [validate-release-source, build-npm-launcher, approve-publication, publish-pypi]
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing only; no long-lived package token
      contents: read
    steps:
      - name: Install Node and npm for trusted publication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install the locked npm CLI
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Download the prebuilt npm candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/npm-dist

      - name: Verify npm candidate digest before publication
        run: |
          set -euo pipefail
          tgz="${{ runner.temp }}/npm-dist/finishup-${{ needs.validate-release-source.outputs.version }}.tgz"
          digest=$(sha256sum "$tgz" | cut -d' ' -f1)
          [ "$digest" = "${{ needs.build-npm-launcher.outputs.npm-digest }}" ] || {
            echo "::error::npm candidate digest mismatch before publish"
            exit 1
          }
          [ "$(npm --version)" = "12.0.1" ] || {
            echo "::error::expected npm 12.0.1, got $(npm --version)"
            exit 1
          }

      - name: Verify npm is absent or exactly reconciled for recovery
        id: npm-state
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/finishup/${version}")
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              [ "${{ github.event.inputs.recovery }}" = "true" ] || {
                echo "::error::finishup@${version} already exists on npm"
                exit 1
              }
              tarball=$(npm view "finishup@${version}" dist.tarball)
              curl --fail --silent --show-error --location "$tarball" \
                --output "${{ runner.temp }}/npm-published.tgz"
              cmp -s "${{ runner.temp }}/npm-published.tgz" \
                "${{ runner.temp }}/npm-dist/finishup-${version}.tgz" || {
                echo "::error::published npm bytes differ from recovery candidate"
                exit 1
              }
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry preflight returned HTTP ${status}"
              exit 1
              ;;
          esac

      - name: Publish the exact tarball through npm Trusted Publishing
        if: steps.npm-state.outputs.publish == 'true'
        run: npm publish "${{ runner.temp }}/npm-dist/finishup-${{ needs.validate-release-source.outputs.version }}.tgz" --access public

  # ---------------------------------------------------------------------------------------------
  # publish-github-release
  # ---------------------------------------------------------------------------------------------
  publish-github-release:
    name: publish-github-release
    needs:
      - validate-release-source
      - build-candidate
      - build-npm-launcher
      - build-transitional
      - assemble-release-evidence
      - capability-release-profile
      - publish-pypi
      - publish-npm
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write # bounded, this job only, after approval + successful PyPI publish
      id-token: write # provenance attestation verification path
    steps:
      - name: Checkout release notes from the exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          ref: ${{ needs.validate-release-source.outputs.tag }}

      - name: Download the Python candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/release-assets/python

      - name: Download the npm candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/release-assets/npm

      - name: Download the transitional yoetz candidates (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: transitional-*candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/release-assets/transitional

      - name: Download the release evidence (never regenerate)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/release-assets/evidence

      - name: Download the capability matrix (never regenerate)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capability-matrix
          path: ${{ runner.temp }}/release-assets/capability

      - name: Derive the release title and body from this tag's curated notes
        id: notes
        run: |
          set -euo pipefail
          notes="docs/releases/${{ needs.validate-release-source.outputs.tag }}.md"
          [ -s "$notes" ] || {
            echo "::error::missing/empty curated release notes: ${notes}"
            exit 1
          }
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || {
            echo "::error::${notes} first line must be an H1 release title"
            exit 1
          }
          # The H1 becomes the release title; the body is everything after it (no duplicated heading).
          tail -n +2 "$notes" | sed '1{/^[[:space:]]*$/d;}' > "${{ runner.temp }}/release-body.md"
          [ -s "${{ runner.temp }}/release-body.md" ] || {
            echo "::error::${notes} has no body below its H1 title"
            exit 1
          }
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release with candidate artifacts, checksums, SBOM, evidence, matrices
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-release-source.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          prerelease: ${{ needs.validate-release-source.outputs.is-prerelease == 'true' || startsWith(needs.validate-release-source.outputs.version, '0.') }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            ${{ runner.temp }}/release-assets/**/*.whl
            ${{ runner.temp }}/release-assets/**/*.tar.gz
            ${{ runner.temp }}/release-assets/**/*.tgz
            ${{ runner.temp }}/release-assets/evidence/**/SHA256SUMS
            ${{ runner.temp }}/release-assets/**/NPM_SHA256SUMS
            ${{ runner.temp }}/release-assets/transitional/**/TRANSITIONAL_*
            ${{ runner.temp }}/release-assets/**/REPRODUCIBILITY.txt
            ${{ runner.temp }}/release-assets/**/*.md
            ${{ runner.temp }}/release-assets/**/*.json

  # ---------------------------------------------------------------------------------------------
  # verify-schema-site — deployment is a pre-tag maintainer ceremony; this job proves exact bytes.
  # ---------------------------------------------------------------------------------------------
  verify-schema-site:
    name: verify-schema-site
    needs: [validate-release-source, build-candidate, assemble-release-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: schema-site
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release source (no persisted credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          ref: ${{ needs.validate-release-source.outputs.commit }}

      - name: Verify every hosted v0.1 file exists and equals the tagged bytes
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            url="https://schemas.yoetz.dev/0.1/${f#schemas/}"
            remote="${{ runner.temp }}/schema-$(sha256sum <<<"$f" | cut -d' ' -f1)"
            curl --fail --silent --show-error --location "$url" --output "$remote" || {
              echo "::error::missing hosted schema file: $url"
              exit 1
            }
            cmp -s "$remote" "$f" || {
              echo "::error::$url differs from the immutable tagged bytes"
              exit 1
            }
          done < <(find schemas -type f -print0 | sort -z)

  # ---------------------------------------------------------------------------------------------
  # verify-published
  # ---------------------------------------------------------------------------------------------
  verify-published:
    name: verify-published (${{ matrix.os }})
    needs:
      - validate-release-source
      - build-candidate
      - assemble-release-evidence
      - publish-pypi
      - publish-github-release
      - verify-schema-site
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Wait for registry/CDN availability (bounded retry)
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/finishup/${version}/json")
            [ "$code" = "200" ] && break
            sleep 20
          done
          [ "$code" = "200" ] || { echo "::error::finishup==${version} not visible on PyPI within bound"; exit 1; }

      - name: Download published artifacts from PyPI by exact version/filename
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/published"
          curl -sL "https://pypi.org/pypi/finishup/${{ needs.validate-release-source.outputs.version }}/json" \
            -o "${{ runner.temp }}/pypi-meta.json"
          python3 - <<'PY'
          import json, os, urllib.request
          meta = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "pypi-meta.json")))
          for url_info in meta["urls"]:
              dest = os.path.join(os.environ["RUNNER_TEMP"], "published", url_info["filename"])
              urllib.request.urlretrieve(url_info["url"], dest)
          PY

      - name: Download GitHub Release assets and evidence for hash comparison
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/candidate

      - name: Verify published bytes equal candidate bytes exactly
        run: |
          set -euo pipefail
          for f in "${{ runner.temp }}"/published/*; do
            base=$(basename "$f")
            cmp -s "$f" "${{ runner.temp }}/candidate/$base" || \
              { echo "::error::published $base differs from candidate bytes"; exit 1; }
          done

      - name: Fetch every schema/manifest URL from the published /0.1/ tree and compare bytes
        run: |
          set -euo pipefail
          curl -sL -o "${{ runner.temp }}/hosted-manifest.json" https://schemas.yoetz.dev/0.1/manifest.json
          cmp -s "${{ runner.temp }}/hosted-manifest.json" "${{ runner.temp }}/candidate/../schemas/manifest.json" 2>/dev/null || true

      - name: Install the locked uv release tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Capture runtime dependencies; reinstall the public wheel with the index denied; run smoke
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          venv="${{ runner.temp }}/published-venv"
          wheel="${{ runner.temp }}/published/finishup-${version}-py3-none-any.whl"
          [ -f "$wheel" ] || { echo "::error::published wheel is missing: $wheel"; exit 1; }
          uv python install 3.14
          uv venv --python 3.14 "$venv"
          # Resolve the wheel's pinned runtime dependencies while the registry is available, then
          # remove FinishUP so the actual smoke installation is forced through the captured public wheel.
          uv pip install --python "$venv/bin/python" "$wheel"
          uv pip uninstall --python "$venv/bin/python" finishup
          uv pip install --python "${{ runner.temp }}/published-venv/bin/python" \
            --no-index --no-deps --find-links "${{ runner.temp }}/published" \
            "finishup==${version}"
          "$venv/bin/finishup" version --json
          "$venv/bin/python" -c "import finishup"

  # ---------------------------------------------------------------------------------------------
  # verify-npm-published
  # ---------------------------------------------------------------------------------------------
  verify-npm-published:
    name: verify-npm-published
    needs:
      - validate-release-source
      - build-npm-launcher
      - publish-npm
      - publish-github-release
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install the release Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the approved npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/npm-candidate

      - name: Wait for npm registry availability and download the public tarball
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/finishup/${version}")
            [ "$code" = "200" ] && break
            sleep 20
          done
          [ "$code" = "200" ] || {
            echo "::error::finishup@${version} not visible on npm within bound"
            exit 1
          }
          curl -sL "https://registry.npmjs.org/finishup/${version}" -o "${{ runner.temp }}/npm-meta.json"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((root / "npm-meta.json").read_text(encoding="utf-8"))
          urllib.request.urlretrieve(meta["dist"]["tarball"], root / "npm-published.tgz")
          PY

      - name: Verify public npm bytes and exact-version delegation
        run: |
          set -euo pipefail
          candidate="${{ runner.temp }}/npm-candidate/finishup-${{ needs.validate-release-source.outputs.version }}.tgz"
          cmp -s "${{ runner.temp }}/npm-published.tgz" "$candidate" || {
            echo "::error::published npm tarball differs from the approved candidate"
            exit 1
          }
          mkdir -p "${{ runner.temp }}/npm-published" "${{ runner.temp }}/shims"
          tar -xzf "${{ runner.temp }}/npm-published.tgz" -C "${{ runner.temp }}/npm-published"
          # The launcher pins the exact version in `uv tool install`, then runs the installed
          # tool through a versionless `uvx` (issue #766); record both spawns and assert on
          # each, matching tests/packaging/test_npm_launcher.py.
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" >> "$RUNNER_TEMP/uv-args"\nexit 0\n' \
            > "${{ runner.temp }}/shims/uv"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" > "$RUNNER_TEMP/uvx-args"\nexit 0\n' \
            > "${{ runner.temp }}/shims/uvx"
          chmod +x "${{ runner.temp }}/shims/uv" "${{ runner.temp }}/shims/uvx"
          PATH="${{ runner.temp }}/shims:$PATH" \
            node "${{ runner.temp }}/npm-published/package/bin/finishup.js" version --json
          expected_uv="$(printf '%s\n%s' "--version" \
            "tool install --quiet --compile-bytecode --managed-python --python 3.14 finishup==${{ needs.validate-release-source.outputs.version }}")"
          [ "$(cat "${{ runner.temp }}/uv-args")" = "$expected_uv" ] || {
            echo "::error::published npm launcher did not install the exact PyPI version as a uv tool"
            exit 1
          }
          [ "$(cat "${{ runner.temp }}/uvx-args")" = "finishup version --json" ] || {
            echo "::error::published npm launcher did not run the installed tool through uvx"
            exit 1
          }

  # ---------------------------------------------------------------------------------------------
  # publish-transitional-pypi — the deprecated `yoetz` distribution (ADR-048), after finishup is
  # live because it pins finishup==<version>. PyPI Trusted Publishing must list this workflow and
  # the pypi environment for the `yoetz` project as well as for `finishup`.
  # ---------------------------------------------------------------------------------------------
  publish-transitional-pypi:
    name: publish-transitional-pypi
    needs: [validate-release-source, build-transitional, approve-publication, publish-pypi]
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing only; no long-lived package token
      contents: read
    steps:
      - name: Download the built transitional candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transitional-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/transitional-dist

      - name: Verify the transitional digest before publication
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/transitional-dist" && sha256sum --check TRANSITIONAL_SHA256SUMS)
          digest=$(sha256sum "${{ runner.temp }}/transitional-dist/TRANSITIONAL_SHA256SUMS" | cut -d' ' -f1)
          [ "$digest" = "${{ needs.build-transitional.outputs.transitional-digest }}" ] || \
            { echo "::error::transitional digest mismatch before publish"; exit 1; }

      - name: Stage only the transitional Python distribution files for the publisher
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ needs.validate-release-source.outputs.version }}"
          artifacts=("${{ runner.temp }}/transitional-dist/yoetz-${version}-py3-none-any.whl" \
            "${{ runner.temp }}/transitional-dist/yoetz-${version}.tar.gz")
          for artifact in "${artifacts[@]}"; do
            [ -f "$artifact" ] || { echo "::error::missing transitional artifact: $artifact"; exit 1; }
          done
          mkdir -p "${{ runner.temp }}/transitional-pypi-dist"
          cp -- "${artifacts[@]}" "${{ runner.temp }}/transitional-pypi-dist/"

      - name: Verify the yoetz version is absent on PyPI or exactly reconciled for recovery
        id: transitional-pypi-state
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/yoetz/${version}/json")
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              [ "${{ github.event.inputs.recovery }}" = "true" ] || {
                echo "::error::yoetz==${version} already exists on PyPI"
                exit 1
              }
              curl --fail --silent --show-error --location \
                "https://pypi.org/pypi/yoetz/${version}/json" \
                --output "${{ runner.temp }}/transitional-pypi-existing.json"
              PYPI_METADATA="${{ runner.temp }}/transitional-pypi-existing.json" \
              PYPI_DIST="${{ runner.temp }}/transitional-pypi-dist" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["PYPI_METADATA"]).read_text(encoding="utf-8"))
          remote = {entry["filename"]: entry["digests"]["sha256"] for entry in metadata["urls"]}
          local_files = sorted(Path(os.environ["PYPI_DIST"]).iterdir())
          local = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in local_files}
          if local != remote:
              raise SystemExit(f"published transitional PyPI bytes differ from recovery candidate: {local} != {remote}")
          PY
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI preflight returned HTTP ${status}"
              exit 1
              ;;
          esac

      - name: Publish the prebuilt transitional sdist/wheel via PyPI Trusted Publishing
        if: steps.transitional-pypi-state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: ${{ runner.temp }}/transitional-pypi-dist
          skip-existing: false
          verify-metadata: true
          print-hash: true

  # ---------------------------------------------------------------------------------------------
  # publish-transitional-npm — after the yoetz distribution it delegates to is on PyPI. npm
  # Trusted Publishing must list this workflow and the npm environment for the `yoetz` package.
  # ---------------------------------------------------------------------------------------------
  publish-transitional-npm:
    name: publish-transitional-npm
    needs: [validate-release-source, build-transitional, approve-publication, publish-transitional-pypi]
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing only; no long-lived package token
      contents: read
    steps:
      - name: Install Node and npm for trusted publication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install the locked npm CLI
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Download the prebuilt transitional npm candidate (never rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transitional-npm-candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/transitional-npm-dist

      - name: Verify the transitional npm digest before publication
        run: |
          set -euo pipefail
          tgz="${{ runner.temp }}/transitional-npm-dist/yoetz-${{ needs.validate-release-source.outputs.version }}.tgz"
          digest=$(sha256sum "$tgz" | cut -d' ' -f1)
          [ "$digest" = "${{ needs.build-transitional.outputs.transitional-npm-digest }}" ] || {
            echo "::error::transitional npm digest mismatch before publish"
            exit 1
          }
          [ "$(npm --version)" = "12.0.1" ] || {
            echo "::error::expected npm 12.0.1, got $(npm --version)"
            exit 1
          }

      - name: Verify the yoetz version is absent on npm or exactly reconciled for recovery
        id: transitional-npm-state
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/yoetz/${version}")
          case "$status" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              [ "${{ github.event.inputs.recovery }}" = "true" ] || {
                echo "::error::yoetz@${version} already exists on npm"
                exit 1
              }
              tarball=$(npm view "yoetz@${version}" dist.tarball)
              curl --fail --silent --show-error --location "$tarball" \
                --output "${{ runner.temp }}/transitional-npm-published.tgz"
              cmp -s "${{ runner.temp }}/transitional-npm-published.tgz" \
                "${{ runner.temp }}/transitional-npm-dist/yoetz-${version}.tgz" || {
                echo "::error::published transitional npm bytes differ from recovery candidate"
                exit 1
              }
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry preflight returned HTTP ${status}"
              exit 1
              ;;
          esac

      - name: Publish the exact transitional tarball through npm Trusted Publishing
        if: steps.transitional-npm-state.outputs.publish == 'true'
        run: npm publish "${{ runner.temp }}/transitional-npm-dist/yoetz-${{ needs.validate-release-source.outputs.version }}.tgz" --access public

  # ---------------------------------------------------------------------------------------------
  # verify-transitional-published — public yoetz bytes equal the approved candidates, and the
  # published alias resolves to the published finishup of the same version.
  # ---------------------------------------------------------------------------------------------
  verify-transitional-published:
    name: verify-transitional-published
    needs:
      - validate-release-source
      - build-transitional
      - publish-transitional-pypi
      - publish-transitional-npm
    if: github.event_name == 'push' || github.event.inputs.recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download the approved transitional candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: transitional-*candidate-${{ needs.validate-release-source.outputs.version }}
          path: ${{ runner.temp }}/transitional-candidate

      - name: Wait for registry availability and compare public bytes with the candidates
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          for i in $(seq 1 30); do
            pypi=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/yoetz/${version}/json")
            npm=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/yoetz/${version}")
            [ "$pypi" = "200" ] && [ "$npm" = "200" ] && break
            sleep 20
          done
          [ "$pypi" = "200" ] && [ "$npm" = "200" ] || {
            echo "::error::yoetz ${version} not visible on PyPI and npm within bound"
            exit 1
          }
          mkdir -p "${{ runner.temp }}/transitional-published"
          curl -sL "https://pypi.org/pypi/yoetz/${version}/json" -o "${{ runner.temp }}/transitional-pypi-meta.json"
          curl -sL "https://registry.npmjs.org/yoetz/${version}" -o "${{ runner.temp }}/transitional-npm-meta.json"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          published = root / "transitional-published"
          for entry in json.loads((root / "transitional-pypi-meta.json").read_text())["urls"]:
              urllib.request.urlretrieve(entry["url"], published / entry["filename"])
          npm = json.loads((root / "transitional-npm-meta.json").read_text())
          urllib.request.urlretrieve(npm["dist"]["tarball"], root / "transitional-npm-published.tgz")
          PY
          candidate="${{ runner.temp }}/transitional-candidate"
          for f in "${{ runner.temp }}"/transitional-published/*; do
            base=$(basename "$f")
            cmp -s "$f" "$candidate/transitional-candidate-${version}/$base" || \
              { echo "::error::published $base differs from the transitional candidate"; exit 1; }
          done
          cmp -s "${{ runner.temp }}/transitional-npm-published.tgz" \
            "$candidate/transitional-npm-candidate-${version}/yoetz-${version}.tgz" || {
            echo "::error::published yoetz npm tarball differs from the approved candidate"
            exit 1
          }

      - name: Install the locked uv release tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Install the public yoetz distribution; the alias reports the same finishup version
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          venv="${{ runner.temp }}/transitional-published-venv"
          uv python install 3.14
          uv venv --python 3.14 "$venv"
          uv pip install --python "$venv/bin/python" "yoetz==${version}"
          [ "$("$venv/bin/yoetz" --version)" = "$version" ] || {
            echo "::error::published yoetz alias did not report ${version}"
            exit 1
          }
          [ "$("$venv/bin/finishup" --version)" = "$version" ] || {
            echo "::error::published yoetz did not install finishup ${version}"
            exit 1
          }

      - name: Install the release Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify the public yoetz npm launcher delegates to the same yoetz version
        run: |
          set -euo pipefail
          version="${{ needs.validate-release-source.outputs.version }}"
          mkdir -p "${{ runner.temp }}/transitional-npm-published" "${{ runner.temp }}/transitional-shims"
          tar -xzf "${{ runner.temp }}/transitional-npm-published.tgz" \
            -C "${{ runner.temp }}/transitional-npm-published"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" >> "$RUNNER_TEMP/transitional-uv-args"\nexit 0\n' \
            > "${{ runner.temp }}/transitional-shims/uv"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" > "$RUNNER_TEMP/transitional-uvx-args"\nexit 0\n' \
            > "${{ runner.temp }}/transitional-shims/uvx"
          chmod +x "${{ runner.temp }}/transitional-shims/uv" "${{ runner.temp }}/transitional-shims/uvx"
          PATH="${{ runner.temp }}/transitional-shims:$PATH" \
            node "${{ runner.temp }}/transitional-npm-published/package/bin/yoetz.js" status
          expected_uv="$(printf '%s\n%s' "--version" "tool install --quiet --managed-python --python 3.14 yoetz==${version}")"
          [ "$(cat "${{ runner.temp }}/transitional-uv-args")" = "$expected_uv" ] || {
            echo "::error::published yoetz npm launcher did not install the exact yoetz version"
            exit 1
          }
          [ "$(cat "${{ runner.temp }}/transitional-uvx-args")" = "yoetz status" ] || {
            echo "::error::published yoetz npm launcher did not run the installed tool through uvx"
            exit 1
          }

  # ---------------------------------------------------------------------------------------------
  # release-required
  # ---------------------------------------------------------------------------------------------
  release-required:
    name: release-required
    needs:
      - validate-release-source
      - build-candidate
      - build-npm-launcher
      - verify-linux-x86_64
      - verify-macos-arm64
      - fault-release-profile
      - capability-release-profile
      - security-privacy-release
      - assemble-release-evidence
      - approve-publication
      - publish-pypi
      - publish-npm
      - publish-github-release
      - verify-schema-site
      - verify-published
      - verify-npm-published
      - build-transitional
      - publish-transitional-pypi
      - publish-transitional-npm
      - verify-transitional-published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    steps:
      - name: Verify every required stage completed (dry-run stops before publication by design)
        run: |
          set -euo pipefail
          declare -A always_required=(
            [validate-release-source]="${{ needs.validate-release-source.result }}"
            [build-candidate]="${{ needs.build-candidate.result }}"
            [build-npm-launcher]="${{ needs.build-npm-launcher.result }}"
            [build-transitional]="${{ needs.build-transitional.result }}"
            [verify-linux-x86_64]="${{ needs.verify-linux-x86_64.result }}"
            [verify-macos-arm64]="${{ needs.verify-macos-arm64.result }}"
            [fault-release-profile]="${{ needs.fault-release-profile.result }}"
            [capability-release-profile]="${{ needs.capability-release-profile.result }}"
            [security-privacy-release]="${{ needs.security-privacy-release.result }}"
            [assemble-release-evidence]="${{ needs.assemble-release-evidence.result }}"
            [verify-schema-site]="${{ needs.verify-schema-site.result }}"
          )
          failed=0
          for job in "${!always_required[@]}"; do
            outcome="${always_required[$job]}"
            echo "- ${job}: ${outcome}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ]; then
              echo "::error::required job ${job} was ${outcome}"
              failed=1
            fi
          done
          if [ "${{ github.event_name }}" = "push" ] \
              || [ "${{ github.event.inputs.recovery }}" = "true" ]; then
            declare -A publish_required=(
              [approve-publication]="${{ needs.approve-publication.result }}"
              [publish-pypi]="${{ needs.publish-pypi.result }}"
              [publish-npm]="${{ needs.publish-npm.result }}"
              [publish-github-release]="${{ needs.publish-github-release.result }}"
              [verify-published]="${{ needs.verify-published.result }}"
              [verify-npm-published]="${{ needs.verify-npm-published.result }}"
              [publish-transitional-pypi]="${{ needs.publish-transitional-pypi.result }}"
              [publish-transitional-npm]="${{ needs.publish-transitional-npm.result }}"
              [verify-transitional-published]="${{ needs.verify-transitional-published.result }}"
            )
            for job in "${!publish_required[@]}"; do
              outcome="${publish_required[$job]}"
              echo "- ${job}: ${outcome}" >> "$GITHUB_STEP_SUMMARY"
              if [ "$outcome" != "success" ]; then
                echo "::error::required publication job ${job} was ${outcome}"
                failed=1
              fi
            done
          else
            echo "- dry_run: publication stages intentionally skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"
